name: Feature request
description: An idea that would make TabPulse more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation where TabPulse falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: input
    id: terminal
    attributes:
      label: Which terminal do you use?
      placeholder: Ghostty, iTerm2, WezTerm, kitty, Terminal.app…
